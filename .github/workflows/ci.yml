name: TMS CI Pipeline

on:
  push:
    branches: [ main, master, "phase-*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tms_user
          POSTGRES_PASSWORD: tms_password
          POSTGRES_DB: tms_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd backend
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://tms_user:tms_password@localhost:5432/tms_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-secret-key-min-32-characters-test
          JWT_REFRESH_SECRET: ci-refresh-secret-key-min-32-characters-test
        run: |
          cd backend
          pytest -v

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build Next.js
        run: |
          cd frontend
          npm run build
